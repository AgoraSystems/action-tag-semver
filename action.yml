name: 'Tag New Semantic Version'
description: "Determine's the next semantic version based on PR labels and existing git tags, and creates a new git tag"
inputs:
  github-token:
    description: 'GitHub Access token, typically passed in with `secrets.GITHUB_TOKEN`.'
    required: true
  major-labels:
    description: 'Comma-separated list of labels that will cause a major version bump.'
    required: true
    default: 'major'
  minor-labels:
    description: 'Comma-separated list of labels that will cause a minor version bump.'
    required: true
    default: 'minor'
  version-prefix:
    description: 'Prefix to use for git tags (for example: "v").'
    required: true
    default: ''
  version-scheme:
    description: 'Versioning scheme to use: "semver" (3-segment, default) or "four-segment" (MAJOR.MINOR.PATCH.HOTFIX for release/** and hotfix/** branches).'
    required: false
    default: 'semver'
  branch-name:
    description: 'The branch name used to determine hotfix/release context. Required when version-scheme is four-segment.'
    required: false
    default: ''
outputs:
  version:
    description: 'The new semantic version'
runs:
  using: 'node24'
  main: 'dist/index.js'
